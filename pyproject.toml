[build-system]
requires = ["setuptools>=77", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "dhidb"
dynamic = ["version"]
description = "TileDB access to the global 300 m Dynamic Habitat Indices database"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
  { name = "Taimur Khan", email = "taimur.khan@ufz.de" },
]
keywords = ["biodiversity", "DHI", "remote sensing", "S3", "TileDB"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: GIS",
]
dependencies = [
  "affine>=2.4",
  "numpy>=1.26,<3",
  "pandas>=2.1",
  "pyproj>=3.6",
  "rasterio>=1.3",
  "shapely>=2.0",
  "tiledb>=0.35,<0.38",
  "xarray>=2024.1",
]

[project.optional-dependencies]
docs = [
  "jupyter-book>=1.0,<2",
  "matplotlib>=3.8",
  "sphinx-copybutton>=0.5",
]
test = [
  "build>=1.2",
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.9",
]

[project.urls]
Homepage = "https://github.com/thisistaimur/dhidb"
Documentation = "https://thisistaimur.github.io/dhidb/"
Repository = "https://github.com/thisistaimur/dhidb"
Issues = "https://github.com/thisistaimur/dhidb/issues"

[tool.setuptools_scm]
fallback_version = "0.1.0.dev0"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
dhidb = ["py.typed"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
